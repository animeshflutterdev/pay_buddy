# version: 2
# updates:
#   - package-ecosystem: "pub"   
#     directory: "/"             
#     schedule:
#       interval: "daily"
version: 2
updates:
  - package-ecosystem: "pub"   
    directory: "/"             
    schedule:
      interval: "daily"
      time: "03:00"              # Time in UTC
    
    ignore:
      - dependency-name: "*"
        update-types: 
          - "version-update:semver-major"
    
    allow:
      - dependency-type: "direct"
    
    open-pull-requests-limit: 15
    
    # Rebase strategy
    rebase-strategy: "auto"
    
    # Only dev dependencies or production
    # allow:
    #   - dependency-type: "development"
    
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    
    pull-request-branch-name:
      separator: "-"
